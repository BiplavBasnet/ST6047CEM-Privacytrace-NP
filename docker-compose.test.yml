services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: privacytrace
      POSTGRES_PASSWORD: privacytrace_test
      POSTGRES_DB: privacytrace_np_test
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privacytrace -d privacytrace_np_test"]
      interval: 2s
      timeout: 3s
      retries: 30
