services:
  postgres:
    image: postgres:16-alpine
    container_name: privacytrace-np-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: privacytrace
      POSTGRES_PASSWORD: privacytrace_dev
      POSTGRES_DB: privacytrace_np
    ports:
      - "5432:5432"
    volumes:
      - privacytrace_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U privacytrace -d privacytrace_np"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  privacytrace_pgdata:
