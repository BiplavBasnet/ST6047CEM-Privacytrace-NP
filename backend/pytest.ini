[pytest]
testpaths = app/tests
python_files = test_*.py
python_functions = test_*
markers =
    integration: tests that require a running PostgreSQL instance
    critical_db: tests that must run when REQUIRE_TEST_POSTGRES=1
    postgres: tests that require a dedicated PostgreSQL test database
    e2e: authenticated cross-phase workflow tests
    ollama: tests that require a local Ollama server with models pulled
addopts = --strict-markers
