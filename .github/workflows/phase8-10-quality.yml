name: Phase 8-10 Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  secret-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_tracked_secrets.py

  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://privacytrace:privacytrace_test@127.0.0.1:5432/privacytrace_np_test
      TEST_DATABASE_URL: postgresql://privacytrace:privacytrace_test@127.0.0.1:5432/privacytrace_np_test
      REQUIRE_TEST_POSTGRES: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: privacytrace
          POSTGRES_PASSWORD: privacytrace_test
          POSTGRES_DB: privacytrace_np_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U privacytrace -d privacytrace_np_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Ruff critical correctness gate
        run: ruff check app app/tests
      - name: Compile repaired package
        run: python -m compileall -q app
      - run: mypy
      - name: Migrations, focused workflow, critical gate, and full backend suite
        run: python ../scripts/run_backend_tests_with_postgres.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
